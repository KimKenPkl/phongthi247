<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng Thi 24/7 · Kimkenpkl</title>
<meta name="theme-color" content="#6D28D9">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css?v=4">
<style>
  .wh-logo { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 12px rgba(56, 189, 248, 0.45); vertical-align: middle; margin-right: 8px; }
  .sig-footer { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #1E1B4B; color: #F8FAFC; font-weight: 700; font-size: 13px; margin-top: 8px; }
  .mode-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 6px; }
  .mode-opt { border: 2px solid var(--line); border-radius: 12px; padding: 10px 13px; cursor: pointer; display: flex; gap: 9px; align-items: flex-start; background: #fff; transition: all .15s ease; }
  .mode-opt:hover { border-color: #C4B5FD; background: #FBF8FF; }
  .mode-opt.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
</style>
</head>
<body>
<div class="container" id="loading" style="padding-top:48px;text-align:center;color:var(--muted)">Đang tải phòng thi…</div>

<!-- 1) Thẻ vào phòng thi -->
<div class="container" id="enterArea" style="display:none">
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <img src="assets/favicon.svg" alt="White-Hat Logo" style="width:36px;height:36px;border-radius:9px">
      <h2 id="examTitle" style="margin:0">—</h2>
    </div>
    <div class="row" id="examMeta" style="margin:6px 0 12px"></div>
    <div class="banner banner-info" id="rulesBox"></div>
    <div class="field"><label>Họ tên em (*)</label><input type="text" id="inpName" placeholder="Ví dụ: Nguyễn Văn An" autocomplete="off"></div>
    <div class="grid2">
      <div class="field"><label>Lớp (*)</label><span id="classWrap"><input type="text" id="inpClass" placeholder="Ví dụ: 12A10"></span></div>
      <div class="field"><label>SBD (nếu có)</label><input type="text" id="inpSbd" placeholder="Số báo danh" autocomplete="off"></div>
    </div>
    <div class="field"><label>Mã phòng thi (*)</label><input type="text" id="inpCode" placeholder="Nhập mã phòng thi" autocomplete="off" style="letter-spacing:.2em;text-transform:uppercase"></div>
    <div class="field" id="modeField">
      <label>Chế độ làm bài</label>
      <div class="mode-box">
        <label class="mode-opt active" id="lblModePractice">
          <input type="radio" name="examMode" value="practice" checked style="margin-top:3px">
          <div>
            <b>💡 Luyện đề cương (Khuyên dùng)</b>
            <div class="hint">Có nút kiểm tra đáp án Đúng/Sai ngay từng câu khi đang làm.</div>
          </div>
        </label>
        <label class="mode-opt" id="lblModeExam">
          <input type="radio" name="examMode" value="exam" style="margin-top:3px">
          <div>
            <b>🎯 Thi thử chuẩn phòng thi</b>
            <div class="hint">Làm hết bài và bấm Nộp bài mới hiện tổng điểm &amp; đáp án.</div>
          </div>
        </label>
      </div>
    </div>
    <p class="err" id="enterErr"></p>
    <div class="row">
      <button class="btn btn-primary" id="btnStart"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>Bắt đầu làm bài</button>
      <a class="btn btn-ghost" href="index.html">← Chọn bài khác</a>
    </div>
    <div class="banner banner-warn" id="resumeBox" style="display:none;margin-top:12px"></div>
  </div>
</div>

<!-- 2) Làm bài -->
<div id="examArea" style="display:none">
  <div class="exam-head">
    <div style="display:flex;align-items:center">
      <img src="assets/favicon.svg" alt="" class="wh-logo">
      <div>
        <strong id="miniTitle">Đang thi…</strong>
        <div class="hint" id="miniStudent" style="color:rgba(255,255,255,.78)"></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 1.5"/></svg><span class="timer" id="timerEl">--:--</span></div>
    <div class="hint" style="color:rgba(255,255,255,.78)" id="exitBadge"></div>
    <button class="btn btn-danger" id="btnSubmit">Nộp bài</button>
  </div>
  <div class="container">
    <div class="palette" id="palette"></div>
    <div id="qView"></div>
    <div id="instantCheckBox" style="margin-top:10px"></div>
    <div class="row" style="margin:14px 0 30px">
      <button class="btn" id="btnPrev">← Câu trước</button>
      <button class="btn" id="btnFlag">⚑ Đánh dấu xem lại</button>
      <button class="btn" id="btnCheckNow" style="display:none;border-color:#059669;color:#047857">💡 Kiểm tra câu này</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="btnNext">Câu sau →</button>
    </div>
  </div>
</div>

<!-- 3) Kết quả -->
<div class="container" id="resultArea" style="display:none"></div>

<footer>
  <span class="sig-footer"><img src="assets/favicon.svg" alt="" style="width:18px;height:18px"> Note: Kimkenpkl · White-Hat Cyber Edition</span>
</footer>

<div id="modalRoot"></div>

<script src="assets/common.js?v=4"></script>
<script src="assets/exam.js?v=4"></script>
</body>
</html>
