<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng Thi 24/7</title>
<meta name="theme-color" content="#0F172A">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css?v=5">
<style>
  .wh-logo { width: 30px; height: 30px; border-radius: 7px; vertical-align: middle; margin-right: 10px; }
  .mode-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 6px; }
  .mode-opt { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; background: #fff; transition: all .15s ease; }
  .mode-opt:hover { border-color: #94A3B8; background: #F8FAFC; }
  .mode-opt.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary); }
</style>
</head>
<body>
<div class="container" id="loading" style="padding-top:48px;text-align:center;color:var(--muted)">Đang tải phòng thi…</div>

<!-- 1) Thẻ vào phòng thi -->
<div class="container" id="enterArea" style="display:none;max-width:680px">
  <div class="card" style="padding:28px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <img src="assets/favicon.svg?v=5" alt="Logo" style="width:36px;height:36px;border-radius:9px">
      <h2 id="examTitle" style="margin:0;font-size:20px">—</h2>
    </div>
    <div class="row" id="examMeta" style="margin:8px 0 14px"></div>
    <div class="banner banner-info" id="rulesBox"></div>
    <div class="field"><label>Họ và tên (*)</label><input type="text" id="inpName" placeholder="Ví dụ: Nguyễn Văn An" autocomplete="off"></div>
    <div class="grid2">
      <div class="field"><label>Lớp (*)</label><span id="classWrap"><input type="text" id="inpClass" placeholder="Ví dụ: 12A1"></span></div>
      <div class="field"><label>Số báo danh (tùy chọn)</label><input type="text" id="inpSbd" placeholder="SBD" autocomplete="off"></div>
    </div>
    <div class="field"><label>Mã phòng thi (*)</label><input type="text" id="inpCode" placeholder="Nhập mã phòng thi" autocomplete="off" style="letter-spacing:.15em;text-transform:uppercase;font-weight:700"></div>
    <div class="field" id="modeField">
      <label>Chế độ làm bài</label>
      <div class="mode-box">
        <label class="mode-opt active" id="lblModePractice">
          <input type="radio" name="examMode" value="practice" checked style="margin-top:3px">
          <div>
            <b>💡 Luyện đề cương (Khuyên dùng)</b>
            <div class="hint">Kiểm tra đáp án Đúng/Sai ngay sau từng câu khi đang làm.</div>
          </div>
        </label>
        <label class="mode-opt" id="lblModeExam">
          <input type="radio" name="examMode" value="exam" style="margin-top:3px">
          <div>
            <b>🎯 Thi thử chuẩn phòng thi</b>
            <div class="hint">Làm hết bài và bấm Nộp bài mới hiện tổng điểm &amp; đáp án.</div>
          </div>
        </label>
      </div>
    </div>
    <p class="err" id="enterErr"></p>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-primary" id="btnStart">Bắt đầu làm bài →</button>
      <a class="btn btn-ghost" href="index.html">← Quay lại danh sách đề</a>
    </div>
    <div class="banner banner-warn" id="resumeBox" style="display:none;margin-top:14px"></div>
  </div>
</div>

<!-- 2) Làm bài -->
<div id="examArea" style="display:none">
  <div class="exam-head">
    <div style="display:flex;align-items:center">
      <img src="assets/favicon.svg?v=5" alt="" class="wh-logo">
      <div>
        <strong id="miniTitle">Đang làm bài…</strong>
        <div class="hint" id="miniStudent" style="color:#94A3B8;font-size:12.5px"></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="timer" id="timerEl">--:--</span></div>
    <div class="hint" style="color:#94A3B8" id="exitBadge"></div>
    <button class="btn btn-danger" id="btnSubmit">Nộp bài</button>
  </div>
  <div class="container">
    <div class="palette" id="palette"></div>
    <div id="qView"></div>
    <div id="instantCheckBox" style="margin-top:10px"></div>
    <div class="row" style="margin:16px 0 30px">
      <button class="btn" id="btnPrev">← Câu trước</button>
      <button class="btn" id="btnFlag">⚑ Đánh dấu xem lại</button>
      <button class="btn" id="btnCheckNow" style="display:none;border-color:#059669;color:#059669">💡 Kiểm tra câu này</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="btnNext">Câu sau →</button>
    </div>
  </div>
</div>

<!-- 3) Kết quả -->
<div class="container" id="resultArea" style="display:none"></div>

<footer>
  <div style="font-weight:600;color:#0F172A">Kimkenpkl</div>
</footer>

<div id="modalRoot"></div>

<script src="assets/common.js?v=6"></script>
<script src="assets/exam.js?v=6"></script>
</body>
</html>
