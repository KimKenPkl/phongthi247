  </defs>
  <!-- Khiên Cyber nền tím đậm -->
  <path d="M32 3L56 12V30C56 46.5 45.8 56.8 32 61C18.2 56.8 8 46.5 8 30V12L32 3Z" fill="url(#bgGrad)" stroke="#C4B5FD" stroke-width="2"/>
